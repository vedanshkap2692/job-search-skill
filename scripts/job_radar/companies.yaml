#   greenhouse: job-boards.greenhouse.io/<slug>   lever: jobs.lever.co/<slug>
#   ashby: jobs.ashbyhq.com/<slug>                 smartrecruiters: jobs.smartrecruiters.com/<slug>
#   workable: apply.workable.com/<slug>            rippling: ats.rippling.com/<slug>
